# Exposes the local GoTrue auth server under the /auth/v1 path prefix that the
# supabase-py client expects ({SUPABASE_URL}/auth/v1/...). Installed to
# /etc/nginx/conf.d/gotrue-proxy.conf by .cursor/scripts/start.sh.
server {
    listen 127.0.0.1:9999;
    server_name localhost;

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9998/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/v1 {
        return 302 /auth/v1/;
    }
}
